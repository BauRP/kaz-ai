name: Kaz AI shell checks
on:
  push:
    branches:
      - main
      - chatgpt/kaz-ai-shell-20261108
  pull_request:
permissions:
  contents: read
jobs:
  verify-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check public/app.js && node --check public/session.js && node --check src/index.js
      - name: Verify shell requirements
        run: node --test tests/shell.test.mjs tests/api.test.mjs
      - name: Install browser test tool
        run: npm install --no-save --ignore-scripts playwright-core
      - name: Check real desktop and mobile browser interactions
        run: node --test tests/browser.test.mjs
      - name: Check Cloudflare Worker build (no deployment)
        run: npx wrangler deploy --dry-run --outdir /tmp/kaz-ai-build
