name: Kaz AI shell checks
on:
  push:
    branches:
      - main
      - chatgpt/kaz-ai-shell-20261108
  pull_request:
permissions:
  contents: read
jobs:
  verify-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check public/app.js
      - name: Verify shell requirements
        run: node --test tests/*.test.mjs
