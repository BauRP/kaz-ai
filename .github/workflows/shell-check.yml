name: Kaz AI modern stack checks
on:
  push:
    branches:
      - main
      - chatgpt/kaz-ai-shell-20261108
  pull_request:
permissions:
  contents: read
jobs:
  verify-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install pinned toolchain
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Verify modern JavaScript and standalone preview
        run: npm run lint && npm run preview:check
      - name: Verify shell, Worker API and progress
        run: npm run test:unit
      - name: Exercise Chrome desktop and mobile interactions
        run: npm run test:browser
      - name: Build Cloudflare Worker without deployment
        run: npx wrangler deploy --dry-run --outdir /tmp/kaz-ai-build
