name: Verify Kaz AI live website reasoning settings (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-site-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Check live production site SSE on low medium high without storing replies
        run: node scripts/verify-site-reasoning.mjs
